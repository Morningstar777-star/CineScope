<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="innerIris" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fda4af" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Camera Lens Base -->
  <circle cx="32" cy="32" r="30" fill="#07090e" stroke="url(#ringGrad)" stroke-width="2"/>
  <circle cx="32" cy="32" r="26" fill="#0b0f19" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Radial Optical Flare Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#lensGlow)"/>

  <!-- Anamorphic Cine Aperture Blades -->
  <g transform="rotate(25 32 32)">
    <!-- Aperture Segment 1 -->
    <path d="M32 14 C38 14 44 18 47 23 L37 28 C35 25 32 23 28 24 Z" fill="url(#ringGrad)" opacity="0.9"/>
    <!-- Aperture Segment 2 -->
    <path d="M50 32 C50 38 46 44 41 47 L36 37 C39 35 41 32 40 28 Z" fill="url(#ringGrad)" opacity="0.9"/>
    <!-- Aperture Segment 3 -->
    <path d="M32 50 C26 50 20 46 17 41 L27 36 C29 39 32 41 36 40 Z" fill="url(#ringGrad)" opacity="0.9"/>
    <!-- Aperture Segment 4 -->
    <path d="M14 32 C14 26 18 20 23 17 L28 27 C25 29 23 32 24 36 Z" fill="url(#ringGrad)" opacity="0.9"/>
  </g>

  <!-- Cinema Lens Pupil -->
  <circle cx="32" cy="32" r="9" fill="#05070a" stroke="url(#innerIris)" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="5" fill="#f43f5e" filter="url(#glow)"/>
  
  <!-- Optical Specular Highlight / Lens Flare Point -->
  <ellipse cx="29" cy="29" rx="2" ry="1.2" fill="#ffffff" transform="rotate(-30 29 29)"/>
  <circle cx="35" cy="35" r="1" fill="#38bdf8" opacity="0.8"/>
</svg>